name: Build Check

on:
  pull_request:
    branches: [ main, Quicker ]
  push:
    branches: [ main, Quicker ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore Quicker.sln

      - name: Build with MSBuild
        run: msbuild Quicker.sln /p:Configuration=Release